="start">50.87% eventual-default rate; require deeper review,</text><text x="990" y="713" font-size="11" fill="#667587" font-weight="400" text-anchor="start">not automatic rejection.</text><circle cx="970" cy="746" r="8" fill="#1F4E78"/><text x="990" y="741" font-size="12" fill="#17212B" font-weight="700" text-anchor="start">Cohort drift</text><text x="990" y="760" font-size="11" fill="#667587" font-weight="400" text-anchor="start">2019 peaks at 21.54%; 2023 is 7.54%. Do not interpret</text><text x="990" y="775" font-size="11" fill="#667587" font-weight="400" text-anchor="start">the change causally.</text><circle cx="970" cy="808" r="8" fill="#2CB67D"/><text x="990" y="803" font-size="12" fill="#17212B" font-weight="700" text-anchor="start">Next action</text><text x="990" y="822" font-size="11" fill="#667587" font-weight="400" text-anchor="start">Monitor limits by sector/rating and track threshold</text><text x="990" y="837" font-size="11" fill="#667587" font-weight="400" text-anchor="start">performance by cohort.</text></svg>